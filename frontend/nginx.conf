# Serves the built SPA and reverse-proxies /api/ to the backend container,
# mirroring the Vite dev proxy so the browser only ever calls relative /api/...
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — preserves the /api prefix the FastAPI app expects.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # research/produce runs are long
        proxy_send_timeout 600s;
    }

    # Legacy public share links (already sent in emails / posted on social media) now live on the
    # public website. The old ?t= token is dropped. Keep this redirect indefinitely.
    location ~ "^/share/briefing/(\d{4}-\d{2}-\d{2})/?$" {
        return 301 https://wvedtalk.com/daily/$1;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built static assets aggressively (hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
