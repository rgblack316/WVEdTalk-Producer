# WV Education News Desk — self-hosted stack.
# Bring up with ./install.sh (first time) or ./upgrade.sh (updates).
# All operator config lives in .env (copy from .env.example).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Intentionally NOT published to the host — only the backend talks to it.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Always target the compose Mongo, regardless of any MONGO_URL in .env.
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "${DB_NAME:-wvedtalk}"
      CONTROL_DIR: "/app/control"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8001"
    # Control volume for the one-click updater: the app writes upgrade.request here and the
    # host watcher (upgrade-watch.sh) reads it + writes status back.
    volumes:
      - ./control:/app/control
    # Probes the open health route (/api/); /api/schedule/next requires auth and 401s the probe.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Only start serving once the API is healthy, so the UI never loads against a cold backend.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    # nginx:alpine ships busybox wget (no curl) — a spider request confirms the SPA is served.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
